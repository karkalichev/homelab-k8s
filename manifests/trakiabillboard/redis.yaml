apiVersion: apps/v1
kind: Deployment
metadata:
  name: trakiabillboard-redis
  namespace: trakiabillboard
spec:
  replicas: 1
  selector:
    matchLabels: { app: trakiabillboard-redis }
  template:
    metadata:
      labels: { app: trakiabillboard-redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: trakiabillboard-redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trakiabillboard-redis-pvc
  namespace: trakiabillboard
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: trakiabillboard-redis
  namespace: trakiabillboard
spec:
  selector: { app: trakiabillboard-redis }
  ports:
    - port: 6379
