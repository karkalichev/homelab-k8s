apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trakiabillboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/karkalichev/homelab-k8s.git
    path: manifests/trakiabillboard
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: trakiabillboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
